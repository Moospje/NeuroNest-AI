site_name: NeuroNest-AI Documentation
site_description: Documentation for the NeuroNest-AI platform
site_author: NeuroNest-AI Team

repo_url: https://github.com/yourusername/NeuroNest-AI
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    primary: blue
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - tables
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - User Guide: user-guide.md
    - Developer Guide: developer-guide.md
  - API Reference: api-reference.md
  - Architecture:
    - Overview: architecture/overview.md
    - Agents: architecture/agents.md
    - Database: architecture/database.md
    - API: architecture/api.md
    - Frontend: architecture/frontend.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
  - git-revision-date-localized:
      type: date

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/NeuroNest-AI
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/yourusername